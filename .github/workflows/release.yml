# Release — 构建双平台包并发布 GitHub Release。两种触发:
#   1. 推送 v* 标签(标准发版)
#   2. Actions 页手动触发(workflow_dispatch):不提交 tag 也能出包。
#      版本号取输入;留空则回退"最近一个 v* tag";连 tag 都没有(冷启动)
#      则退化为 0.0.0-<短SHA>。产物挂到 v<版本> 的 Release 上(不存在则创建)。
#
# 产物命名沿用 docs/quickstart.md 的约定(dist/ 下的裸二进制,kistctl-<版本>-<os>-<arch>):
#   kist-<版本>-linux-amd64(.tar 无壳裸 ELF,GUI)   kistctl-<版本>-linux-amd64(CLI)
#   kist-<版本>-windows-amd64.exe(GUI)              kistctl-<版本>-windows-amd64.exe(CLI)
#   checksums.txt(sha256)
#
# 平台策略沿用 Makefile 的既定前提:依赖纯 Go、无 CGO(modernc.org/sqlite),
# Windows GUI 由 Linux 交叉编译(build-windows 同款);Linux GUI 原生编译需
# webkit2gtk-4.1。发布前先跑一遍全量测试,红了不发。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(不带 v 前缀,如 0.2.1;留空取最近 tag)'
        required: false
        default: ''

permissions:
  contents: write # 创建 Release 并上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0:手动触发无 tag 时,git describe 需要完整历史才能找到最近 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 webkit2gtk 构建依赖与 wails CLI(版本钉住 go.mod)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # 前端只构建一次,两次 wails build 都 -s 跳过(确定性 + 省时)
      - name: 构建前端(产出 frontend/dist)
        working-directory: frontend
        run: npm ci && npm run build

      - name: 发布前全量测试(-race)
        run: xvfb-run -a make test

      # 版本号优先级:手动输入 > 当前 tag(push 触发)> 最近 v* tag(describe)>
      # 0.0.0-<短SHA>(冷启动兜底)。输入经 env 间接引用,不拼进命令防注入。
      - name: 计算版本号
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            V="${V#v}"
          fi
          if [ -z "$V" ]; then
            V="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "发布版本:$VERSION"

      # -ldflags 注入 version/commit(cmd/kistctl 与 GUI 关于框同源)
      - name: 构建 Linux(GUI 原生 + CLI 静态)
        run: |
          LDFLAGS="-X main.version=$VERSION -X main.commit=${GITHUB_SHA::7}"
          mkdir -p dist
          wails build -tags webkit2_41 -s -ldflags "$LDFLAGS"
          cp build/bin/kist "dist/kist-$VERSION-linux-amd64"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w $LDFLAGS" \
            -o "dist/kistctl-$VERSION-linux-amd64" ./cmd/kistctl

      - name: 构建 Windows(GUI 交叉 + CLI 交叉;纯 Go 无 CGO,Linux 直出)
        run: |
          LDFLAGS="-X main.version=$VERSION -X main.commit=${GITHUB_SHA::7}"
          wails build -platform windows/amd64 -tags webkit2_41 -s -ldflags "$LDFLAGS"
          cp build/bin/kist.exe "dist/kist-$VERSION-windows-amd64.exe"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w $LDFLAGS" \
            -o "dist/kistctl-$VERSION-windows-amd64.exe" ./cmd/kistctl

      - name: 生成 sha256 校验和
        working-directory: dist
        run: sha256sum * > checksums.txt

      # tag_name 显式指定:手动触发时 ref 是分支名,不指定会拿分支名当 tag;
      # 指定后自动在当前 commit 建 v<版本> tag 并挂 Release(已存在则更新)
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
